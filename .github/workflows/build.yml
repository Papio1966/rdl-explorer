name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run RDL-014 runtime hardening contract
        run: npm run test:rdl-014

      - name: Run RDL-015 deployment and observability contract
        run: npm run test:rdl-015

      - name: Run regression suite
        run: npm run test:regression

      - name: Build application
        run: npm run build

      - name: Package deployment artifact
        run: npm run package:deployment

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v5
        with:
          name: rdl-explorer-deployment
          path: artifacts/rdl-explorer-deployment.tgz
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: Browser E2E and accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14